# Render blueprint for the Fellow Lodge backend (Supabase PostgreSQL + Supabase Storage).
# Import this file in Render:  New -> Blueprint -> repo root
# The service runs from the Docker image built by ./Dockerfile.
# Secrets (SUPABASE_DB_USERNAME / SUPABASE_DB_PASSWORD / SUPABASE_SERVICE_ROLE_KEY)
# are set in the Render dashboard and are marked sync: false so they are never
# committed or generated.
#
# Storage: uploaded files go to public Supabase Storage buckets (server-side via
# the service-role key). No persistent disk is used, which is why this service
# fits the free tier.
services:
  - type: web
    name: fellow-lodge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKETS
        value: rooms,gallery,events,conferences,banners,menu,profiles,attractions,services,misc
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: 5432
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: CORS_ALLOWED_ORIGINS
        value: https://law-aegis-fellow-lodge.vercel.app,https://fellow-lodge-guest.vercel.app
