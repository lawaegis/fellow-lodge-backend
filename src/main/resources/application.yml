spring:
  application:
    name: fellow-lodge-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:${SERVER_PORT:8081}}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  version: ${APP_VERSION:2.0.0}
  min-desktop-version: ${MIN_DESKTOP_VERSION:2.0.0}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:1800000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    supabase-url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    buckets: ${SUPABASE_STORAGE_BUCKETS:}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${LOCK_DURATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173,http://localhost:8081,https://law-aegis-fellow-lodge.vercel.app,https://guest-oasis.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.fellowlodge.api: INFO
  file:
    name: ./logs/fellow-lodge-backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
