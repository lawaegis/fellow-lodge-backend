spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME}?sslmode=${SUPABASE_DB_SSLMODE:require}&prepareThreshold=0
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FellowLodgeSupabasePool
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:10}
      minimum-idle: ${SUPABASE_DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      initialization-fail-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

app:
  storage:
    # Local-filesystem fallback dir (only used when SUPABASE_SERVICE_ROLE_KEY is absent).
    # /tmp keeps Render's disk-less free tier happy if the fallback is ever hit.
    upload-dir: ${UPLOAD_DIR:/tmp/uploads}
