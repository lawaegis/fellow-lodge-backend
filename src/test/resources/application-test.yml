spring:
  datasource:
    url: jdbc:h2:mem:fellowlodge-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: YmVsbG93LWxvZGdlLWZlZWxsb3ctc2VjdXJlLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjYtcGxhdGZvcm0=
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 604800000
  security:
    max-login-attempts: 5
    lock-duration-minutes: 30
  storage:
    upload-dir: ./uploads-test

logging:
  file:
    name: ./logs/fellow-lodge-backend-test.log
